# Lab 5 challenge: one MySQL server, on your own machine.
#   Start:            docker compose up -d --wait
#   Open a shell:     docker compose exec db bash      (your repo is at /work inside)
#   Stop:             docker compose stop
#   Delete EVERYTHING (data included):  docker compose down -v
#
# Do not edit this file. The grader uses the instructor's copy, so any change you make
# here only makes your machine different from the grader's.
name: lab5

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "RootPass123!"
    command:
      - --innodb-lock-wait-timeout=10
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./:/work
    # No "ports:" on purpose. Nothing outside the container can reach this server,
    # and it cannot clash with a MySQL you may already have installed.
    healthcheck:
      # TCP on 127.0.0.1 only answers once the real server is up (the first-start
      # setup server runs without networking), so --wait does not return too early.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  dbdata:
